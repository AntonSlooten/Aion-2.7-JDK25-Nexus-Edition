# ----------------------------
# Companion bot config's:
# ----------------------------

# Maximum number of companion bots a single player may summon at once.
# Real hard cap is 5, since a 6-member group must still fit the host.
# Default: 5
gameserver.companion.maxbots = 5

# Seconds a dead companion bot waits before self-reviving.
# Default: 8
gameserver.companion.revivedelay = 8

# HP percent below which a companion bot prioritizes healing over attacking. Deliberately high (not
# just "critical") - the AI only re-evaluates every ~750ms (aithinkinterval below), so a low
# threshold lets burst damage kill a target between two ticks before the bot ever notices it needed
# healing.
# Default: 90
gameserver.companion.healhpthreshold = 90

# HP percent below which a companion bot tops a group member back up while out of combat, even if
# they're not hurt enough to trigger healhpthreshold's urgent priority.
# Default: 95
gameserver.companion.idlehealhpthreshold = 95

# Milliseconds between companion bot AI decision ticks.
# Default: 750
gameserver.companion.aithinkinterval = 750

# Verbose per-tick companion-bot AI diagnostic logging (engage checks, every skill cast attempt and why,
# movement registration, rotation-candidate dumps). Only turn on while actively debugging a bot AI issue -
# far too noisy for normal play.
# Default: false
gameserver.companion.debuglogging = false
