# ----------------------------
# Diagnostic logging toggles - each one is verbose (multiple log lines per relevant event, some per
# tick), only turn on while actively investigating that specific subsystem.
# ----------------------------

# NPC combat AI state/aggro-list tracing ([aggro]/[aistate]/[knownlist]/[regen]/[heal]).
# Default: false
gameserver.debug.npccombat = false

# Skill-cast rejection tracing, names the exact precondition that failed ([skilldiag]).
# Default: false
gameserver.debug.skillengine = false

# Periodic packet-processor queue/thread health snapshot ([PACKETHEALTH]).
# Default: false
gameserver.debug.network = false
