# ----------------------------
# Database Config's:
# ----------------------------

# This class represents database driver class that will be used while connecting to database
database.driver = com.mysql.cj.jdbc.Driver

# This is database url. 
database.url = jdbc:mysql://localhost:3306/al_server_gs?useUnicode=true&characterEncoding=UTF-8

# Database user
database.user = root

# Database password
# NOTE: Change this! Root password is not safe!
database.password = 

# Legacy pool sizing. Runtime pool is HikariCP, keys are kept for Aion 2.7 compatibility.
# Effective maxPoolSize = partition.count * partition.connections.max
database.bonecp.partition.count = 2

# Effective minimumIdle = partition.count * partition.connections.min
database.bonecp.partition.connections.min = 2

# Maximum amount of connections per legacy partition
database.bonecp.partition.connections.max = 5

# Script context that will be loaded by database factory, it should implement DAO instances
database.scriptcontext.descriptor = ./data/scripts/system/database.xml

# HikariCP timing tuning in milliseconds
database.hikari.connection.timeout = 30000
database.hikari.validation.timeout = 5000
database.hikari.idle.timeout = 600000
database.hikari.max.lifetime = 1800000

# Set to 0 in production. Use 60000 temporarily when debugging connection leaks.
database.hikari.leak.detection.threshold = 0
